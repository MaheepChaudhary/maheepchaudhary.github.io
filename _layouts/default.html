---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body>
    {% include browser-upgrade.html %}
    {% include masthead.html %}

    <!-- Place the toggle here, so it is visible on the page -->
    
    {{ content }}

    <div class="page__footer">
      <footer>
        {% include footer/custom.html %}
        {% include footer.html %}
      </footer>
    </div>

    {% include scripts.html %}

  <div id="template-toggle-container">
  <label>
    <input type="radio" name="template" value="human" onclick="window.location.href='/'"> HUMAN
  </label>
  <label>
    <input type="radio" name="template" value="machine" onclick="window.location.href='/machine.html'"> MACHINE
  </label>
  </div>

  <script>
  (function() {
    var isMachine = window.location.pathname.includes('machine');
    var activeRadio = document.querySelector('input[value="' + (isMachine ? 'machine' : 'human') + '"]');
    activeRadio.checked = true;
    activeRadio.style.backgroundColor = '#f1c40f';
    activeRadio.style.borderColor = '#f1c40f';
  })();
  </script>

  </body>
</html>
